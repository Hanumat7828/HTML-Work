<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body bgcolor="pink"> <center>
    <header>
        <font  style="background-color: rgb(249, 249, 9); background-size: 5; font-size:xx-large;text-transform: uppercase;">
        <b>General Form Formet</b><br>
        </font>
    </header>
    <form method="post">
        <b>First Name : </b><br><br>
        <input type="text" name="firstname" style="background-color: rgb(0, 255, 242);"/><br><br>
        <b>Last Name : </b><br><br>
        <input type="text" name="lastname" style="background-color: rgb(0, 255, 132);"/><br><br>
        <b>User ID : </b><br><br>
        <input type="password" name="contect" style="background-color: rgb(255, 0, 238);"/><br><br>
        <b>E-Mail : </b><br><br>
        <input type="email" name="mail"  style="background-color: rgb(30, 255, 0);"/><br><br>
        <b>Gender : </b><br><br>
        <input type="radio" name="gender" value="male" />Male
        <input type="radio" name="gender" value="female" />female
        <input type="radio" name="gender" value="other" />Other<br><br>
        <b>Hobby :</b><br><br>
        <input type="checkbox" name="hockey" value="hockey"/>Hockey
        <input type="checkbox" name="cricket" value="cricket" />Cricket
        <input type="checkbox" name="Videogames" value="Videogames" />Video Games 
        <input type="checkbox" name="planting" value="planting" />Planting<br><br>
        <b>Address : </b><br><br>
        <textarea name="Address" rows="5" cols="20" style="background-color: rgb(144, 0, 255);color: aliceblue;"></textarea><br><br>
        <b>State : </b><br><br>
        <select name="state">
            <option value="MP" style="background-color: rgb(4, 255, 0);" >Madhya Pradesh</option><br>
            <option value="UP" style="background-color: rgb(255, 255, 0);">Uttar Pradesh</option><br>
            <option value="select" selected >Select</option>
        </select> <br><br>
        <input type="reset" value="reset" style="background-color: rgb(229, 255, 0);"/>
        <input type="submit" value="submit" style="background-color: rgb(255, 0, 225); animation-name: unset;"/>
    </form>
    </center>
</body>
</html>
